  <text x="44" y="148" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">AI-powered products.</text>
  <text x="44" y="214" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">Run them well.</text>
  <text x="48" y="270" fill="#a5bad4" font-family="Arial, Helvetica, sans-serif" font-size="19">AI ENGINEERING / FULL-STACK / DEVOPS</text>
